name: Meltype-flash additional distributions
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Flash preview release to extend (engine built from this tag)
        required: true
        default: flash-v0.1.0-preview.3
      publish:
        description: Attach tested packages to the existing prerelease
        type: boolean
        default: false
  pull_request:
    branches: [rust]
    paths: ['ios/**', 'rust/ios/**', 'rust/package-linux.py', 'packaging/Meltype-flash.iss', 'tools/extend-flash-release.py', '.github/workflows/rust-distributions.yml']
permissions:
  contents: read
concurrency:
  group: flash-distributions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG: ${{ inputs.tag || 'flash-v0.1.0-preview.3' }}
        run: test "$TAG" = flash-v0.1.0-preview.3
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify published Rust Windows bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'flash-v0.1.0-preview.3' }}
        run: |
          gh release download $env:TAG --repo appipinopi/Meltype-Flash --pattern Meltype-flash-Windows-x64.zip --pattern SHA256SUMS.txt --dir input
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          python tools/extend-flash-release.py verify input/Meltype-flash-Windows-x64.zip input/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Checksum failed' }
          Expand-Archive input/Meltype-flash-Windows-x64.zip -DestinationPath bundle
          ./bundle/Manage-Windows.ps1 -Action Inspect
      - name: Build Rust setup and portable distribution
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"').Matches.Groups[1].Value
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup is absent' }
          New-Item -ItemType Directory dist -Force | Out-Null
          & $iscc "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path bundle).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" packaging/Meltype-flash.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed' }
          Copy-Item bundle portable -Recurse
          '@echo off' + "`r`n" + 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-Portable.ps1" -Tray' + "`r`n" | Set-Content portable/Start-Portable.cmd -Encoding ascii
          $manifest = Get-Content portable/SHA256SUMS.json -Raw | ConvertFrom-Json -AsHashtable
          $manifest['Start-Portable.cmd'] = (Get-FileHash portable/Start-Portable.cmd -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json | Set-Content portable/SHA256SUMS.json -Encoding utf8
          ./portable/Manage-Windows.ps1 -Action Inspect
          Compress-Archive portable/* dist/Meltype-flash-Windows-portable.zip
          Copy-Item input/Meltype-flash-Windows-x64.zip dist/Meltype-flash-Windows.zip
      - name: Exercise actual installer and uninstaller
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          $result = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=setup.log' -WindowStyle Hidden -Wait -PassThru
          Get-Content setup.log -Tail 90
          Get-ChildItem 'C:/Program Files/Meltype-flash' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($result.ExitCode -ne 0) { throw "Setup failed: $($result.ExitCode)" }
          $state = Get-Content 'C:/Program Files/Meltype-flash/installed.json' -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $state.x64)) { throw 'Installed IME DLL missing' }
          $result = Start-Process -FilePath 'C:/Program Files/Meltype-flash/installer/unins000.exe' -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=uninstall.log' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall failed: $($result.ExitCode)" }
          $registered = Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE/SOFTWARE/Classes/CLSID/{C540BAF6-88B1-5B30-B524-2C8702B034FC}/InprocServer32' -ErrorAction SilentlyContinue
          if ($null -ne $registered) { throw 'Flash COM registration remains' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-windows-setup-logs
          path: |
            setup.log
            uninstall.log
      - uses: actions/upload-artifact@v4
        with:
          name: flash-distributions-windows
          path: dist/*
          if-no-files-found: error
  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tools -p test_flash_distributions.py -v
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || 'flash-v0.1.0-preview.3' }}
          path: engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          shared-key: flash-distributions-${{ matrix.arch }}
      - run: sudo apt-get update && sudo apt-get install -y libibus-1.0-dev ibus gir1.2-ibus-1.0 python3-gi dbus-x11 xvfb fonts-noto-cjk libxkbcommon-x11-0
      - run: bash rust/build-linux.sh
        working-directory: engine
      - name: Test packaged engine and create ZIP and deb
        run: |
          python3 engine/rust/ibus/tests/installation.py engine/target/release/meltype-ibus
          MELTYPE_IBUS_TEST_INSTALLED=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 engine/rust/ibus/tests/integration.py engine/target/release/meltype-ibus
          python3 rust/package-linux.py engine/linux/build/Meltype-flash-linux dist --version 0.1.0-pre.3 --arch ${{ matrix.arch }}
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/libexec/meltype-flash/ibus/meltype-ibus
          test -f /usr/share/ibus/component/meltype-flash.xml
          /usr/libexec/meltype-flash/ibus/meltype-ibus --version
          grep -F /usr/libexec/meltype-flash/ibus/meltype-ibus /usr/share/ibus/component/meltype-flash.xml
          sudo apt-get remove -y meltype-flash
          test ! -e /usr/share/ibus/component/meltype-flash.xml
      - uses: actions/upload-artifact@v4
        with:
          name: flash-distributions-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  ios:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flash-ios
      - run: brew install xcodegen
      - run: cargo test -p meltype-ios --locked
      - run: cargo clippy -p meltype-ios --all-targets --locked -- -D warnings
      - run: bash ios/build.sh
      - name: Exercise keyboard controller on iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/MeltypeFlash.xcodeproj -scheme MeltypeFlash -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/build/tests CODE_SIGNING_ALLOWED=NO test
      - name: Export source for locally signed device builds
        run: |
          git archive --format=zip --output=dist/Meltype-flash-iOS-source.zip HEAD
          cp ios/README.md dist/README-iOS.md
      - uses: actions/upload-artifact@v4
        with:
          name: flash-distributions-ios
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/rust'
    needs: [windows, linux, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: flash-distributions-*
          path: distributions
          merge-multiple: true
      - name: Require packaging source to match the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
      - name: Attach only after every package test passes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/extend-flash-release.py publish "$TAG" distributions
