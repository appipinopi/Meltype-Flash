[package]
name = "meltype-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "meltype_native"
crate-type = ["cdylib", "rlib"]

[features]
tsf-server = []
android-jni-test = ["dep:jni", "dep:tempfile", "dep:meltype-ai"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
serde.workspace = true
libc = "0.2"
unicode-normalization = "0.1"
jni = { version = "0.21", optional = true }
meltype-ai = { path = "../ai", optional = true, features = ["download"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Foundation_Numerics", "Data_Text", "Foundation_Collections", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_TextServices", "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_Ole", "Win32_System_Com", "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects",
] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
meltype-ai = { path = "../ai", features = ["download"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSAttributedString", "NSGeometry", "NSArray", "NSRange", "NSEnumerator", "NSProcessInfo", "objc2-core-foundation"] }
