[package]
name = "meltype-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meltype-flash"
path = "src/main.rs"

[features]
visual-test = ["eframe/__screenshot"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = "=0.17.2"

[dev-dependencies]
tempfile = "3"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "=0.26.1", default-features = false }
ab_glyph = "0.2"
fs2 = "0.4"
tempfile = "3"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Authentication_Identity", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
