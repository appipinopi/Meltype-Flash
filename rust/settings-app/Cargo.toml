[package]
name = "meltype-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meltype-flash"
path = "src/main.rs"

[features]
visual-test = ["eframe/__screenshot"]

[dependencies]
meltype-core.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = "=0.17.2"
# リリースノートの Markdown。HTML 変換は使わない。
pulldown-cmark = { version = "0.12", default-features = false }

[dev-dependencies]
roxmltree = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
meltype-ai = { path = "../ai", default-features = false, features = ["download"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 利用状況の集計 (Aptabase)。Linux の設定画面から HTTPS で送る。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[target.'cfg(windows)'.dependencies]
# 利用状況の集計 (Aptabase)。Windows の設定画面から HTTPS で送る。
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
roxmltree = "0.20"
raw-window-handle = "0.6"
tray-icon = { version = "=0.26.1", default-features = false }
ab_glyph = "0.2"
fs2 = "0.4"
tempfile = "3"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Authentication_Identity", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Globalization", "Wdk_System_SystemServices"] }
