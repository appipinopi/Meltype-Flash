[workspace]
members = ["rust/core", "rust/native", "rust/cli", "rust/settings-app", "rust/ibus", "rust/tip-worker", "rust/mac-register", "rust/browser", "rust/ios"]
resolver = "2"

[workspace.package]
version = "0.1.0-pre.4"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/appipinopi/Meltype"

[workspace.dependencies]
meltype-core = { path = "rust/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
