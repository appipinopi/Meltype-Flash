name: Meltype-flashの改善の提案
description: こうなったら使いやすい、という提案
title: "[提案] "
labels: ["提案"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。今は不具合の修正と判定・変換の精度を優先しているため、すぐには入れられないことがあります。

        ここはMeltype-flash（Rust版）の窓口です。[本家Meltype（C#版）だけの報告は本家へ](https://github.com/yksr-melt/Meltype/issues/new/choose)お願いします。両方で起きる場合や判断できない場合は、このフォームを使えます。[報告先の分け方](https://github.com/appipinopi/Meltype-Flash/blob/rust/docs/ISSUE-TRIAGE.md)

  - type: dropdown
    id: product
    attributes:
      label: 報告対象
      options:
        - Meltype-flash（Rust版）
        - Meltype-flashと本家Meltypeの両方
        - 分からない
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何が不便か
      placeholder: "Discord で絵文字を打つとき、毎回 : を打つのが面倒"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - ChromeOS
        - iOS
