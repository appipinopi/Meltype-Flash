name: Meltype-FLASHの不具合
description: 動かない・止まる・落ちる・表示がおかしいなど
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。日本語・英語の判定や変換の間違い (「日本語」が「にほんgo」になった など) は、「変換・判定の間違い」から報告してください。
        ⚠ パスワードや個人的な文章を貼らないでください。ログには直前に打った文字の一部が入ることがあります。見られて困る部分は消してから貼ってください。

        ここはMeltype-FLASH（Rust版）の窓口です。[本家Meltype（C#版）だけの報告は本家へ](https://github.com/yksr-melt/Meltype/issues/new/choose)お願いします。両方で起きる場合や判断できない場合は、このフォームを使えます。[報告先の分け方](https://github.com/appipinopi/Meltype-Flash/blob/rust/docs/ISSUE-TRIAGE.md)

  - type: dropdown
    id: product
    attributes:
      label: 報告対象
      options:
        - Meltype-FLASH（Rust版）
        - Meltype-FLASHと本家Meltypeの両方
        - 分からない
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Android
        - ChromeOS
        - iOS
    validations:
      required: true

  - type: input
    id: os-detail
    attributes:
      label: OS の詳細 (分かれば)
      description: "macOS: 版とCPU。Linux: 版・デスクトップ・Wayland/X11。Android・iOS: 版と機種。ChromeOS: 版と機種・キーボード配列。"
      placeholder: Ubuntu 24.04 / GNOME / Wayland

  - type: dropdown
    id: version
    attributes:
      label: Meltype-FLASH の版
      description: "使用中の版を公開リリースの版番号から選択してください。開発版はそのほかを選び、詳細に記入してください。"
      options:
        - "1.0.1"
        - "1.0.0"
        - "0.1.0-pre.7"
        - "0.1.0-pre.6"
        - "0.1.0-pre.5"
        - "0.1.0-pre.4"
        - "0.1.0-pre.3"
        - "0.1.0-pre.2"
        - "0.1.0-pre.1"
        - "そのほか / 開発版"
        - "分からない"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 使っていたモード (Windows)
      options:
        - Meltype-FLASH IME (入力欄に直接入力)
        - Meltype-FLASH キーボード (変換ボックスで入力)
        - 分からない / Windows以外

  - type: input
    id: app
    attributes:
      label: どのアプリで
      placeholder: Discord / Chrome の検索欄 / VS Code / メモ帳
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 何をしたら
      description: できるだけ順番に。打ったキーはそのまま書いてください
      placeholder: |
        1. Discord のメッセージ欄をクリック
        2. kyouha と打って Space
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: どうなったか
      description: スクリーンショットがあれば貼ってください
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: どうなってほしかったか

  - type: dropdown
    id: frequency
    attributes:
      label: 起きる頻度
      options:
        - 毎回
        - ときどき
        - 一度だけ

  - type: textarea
    id: log
    attributes:
      label: ログ (あれば)
      description: |
        Windows: トレイのアイコンを右クリック →「ログ / 判定理由...」→「コピー」
        Mac: ターミナルで log stream --predicate 'process == "Meltype"' --level debug を実行してから操作
        見られて困る部分は消してください。
      render: text

  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: Meltype の「不具合の報告・提案...」→「GitHub で報告」から開くと自動で入ります (入力した文字は入りません)。
      render: text
