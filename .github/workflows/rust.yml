  android:
    if: ${{ inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rust-android-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rust Android editor through a checked JVM JNI host
        run: |
          cargo clippy -p meltype-native --all-targets --features android-jni-test --locked -- -D warnings
          cargo test -p meltype-native --lib --features android-jni-test --locked
          cargo build -p meltype-native --features android-jni-test --locked
          python3 rust/native/tests/android_editor_smoke.py target/debug
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build JNI libraries
        env:
          CARGO_NDK_PLATFORM: '26'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p meltype-native --release --locked
      - run: gradle -p android assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Instrumentation result gate checks
        run: python3 android/tests/test_instrument_report.py
      - name: Install private emulator runtime
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Real Android widgets and controlled InputConnection
        timeout-minutes: 12
        run: bash android/tests/run-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meltype-android-runtime-evidence
          path: dist/android-emulator/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meltype-rust-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            LICENSE
            THIRD-PARTY-NOTICES.md
  extension:
    if: ${{ inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned wasm-bindgen CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern '*x86_64-unknown-linux-musl.tar.gz*'
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz"); assert hashlib.sha256(p.read_bytes()).hexdigest()==pathlib.Path(str(p)+".sha256sum").read_text().split()[0]'
          tar -xzf wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: cargo clippy -p meltype-browser --target wasm32-unknown-unknown --locked -- -D warnings
      - run: python3 chromeos/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Meltype-ChromeOS-preview
          path: dist/chromeos-preview.zip
  fcitx-sdk:
    if: ${{ !inputs.packages_only && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install fcitx5 development SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - run: cargo clippy -p meltype-native --all-targets --locked -- -D warnings
      - run: cargo test -p meltype-native --lib --locked
      - run: cargo build -p meltype-native --release --locked
      - name: Build Rust and legacy SDK adapters
        run: |
          cmake -S linux/fcitx5 -B linux/build/fcitx5-rust -DMELTYPE_RUST_CORE=ON -DMELTYPE_RUST_ABI_TESTS=ON
          cmake --build linux/build/fcitx5-rust --parallel 2
          cmake -S linux/fcitx5 -B linux/build/fcitx5-legacy -DMELTYPE_RUST_CORE=OFF
          cmake --build linux/build/fcitx5-legacy --parallel 2
      - name: Compare production adapters with references and actual Rust core
        run: |
          set -euo pipefail
          mkdir -p dist/fcitx-abi
          python3 linux/fcitx5/test/json_bridge.py target/release/libmeltype_native.so | tee dist/fcitx-abi/json.txt
          linux/build/fcitx5-rust/testkeymapping "$PWD/target/release/libmeltype_native.so" | tee dist/fcitx-abi/keys.txt
          python3 linux/fcitx5/test/state_abi.py target/release/libmeltype_native.so | tee dist/fcitx-abi/state.txt
          python3 linux/fcitx5/test/event_abi.py target/release/libmeltype_native.so | tee dist/fcitx-abi/events.txt
          dpkg-query -W -f='${Package} ${Version}\n' libfcitx5core-dev libfcitx5utils-dev > dist/fcitx-abi/sdk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcitx-rust-abi-evidence
          path: dist/fcitx-abi
          if-no-files-found: ignore
  macos-sdk:
    if: ${{ !inputs.packages_only && inputs.platform != 'ios' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p meltype-native -p meltype-mac-register --all-targets --locked -- -D warnings
      - run: cargo test -p meltype-native -p meltype-mac-register --lib --locked
      - run: cargo build -p meltype-native -p meltype-mac-register --release --locked
      - name: Compare actual Swift bridge and Rust ABI with Carbon SDK policy
        run: |
          set -euo pipefail
          mkdir -p dist/macos-sdk
          bash mac/test/register-helper/run.sh "$PWD/target/release/meltype-register-input-source" | tee dist/macos-sdk/register-helper.txt
          bash mac/test/key-policy/run.sh "$PWD/target/release/libmeltype_native.dylib" | tee dist/macos-sdk/keys.txt
          swift --version > dist/macos-sdk/swift.txt
          sw_vers > dist/macos-sdk/system.txt
      - name: Controlled IMK and Unicode boundary integration
        run: |
          set -euo pipefail
          python3 rust/native/tests/macos_product_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/product-abi.txt
          python3 rust/native/tests/macos_registration_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/registration.txt
          python3 rust/native/tests/macos_dictionary_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/dictionary.txt
          python3 rust/native/tests/macos_meaning_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/meaning.txt
          python3 rust/native/tests/macos_candidates_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/candidates.txt
          python3 rust/native/tests/macos_view_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/composition.txt
          python3 rust/native/tests/macos_apply_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/apply.txt
          python3 rust/native/tests/word_checker_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/word-checker.txt
          python3 rust/native/tests/macos_boundary_smoke.py target/release/libmeltype_native.dylib | tee dist/macos-sdk/native-boundaries.txt
          python3 tools/test-mac-boundaries.py target/release/libmeltype_native.dylib --rust-core | tee dist/macos-sdk/boundaries.txt
          python3 tools/test-mac-events.py target/release/libmeltype_native.dylib --rust-core | tee dist/macos-sdk/events.txt
      - name: Pinned azooKey engine through actual Rust and controlled IMK callbacks
        run: |
          set -euo pipefail
          python3 tools/test-mac-events.py target/release/libmeltype_native.dylib --rust-core --real-converter | tee dist/macos-sdk/real-converter.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-rust-sdk-evidence
          path: dist/macos-sdk
          if-no-files-found: ignore
  production-swift:
    if: ${{ !inputs.packages_only && inputs.platform != 'ios' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: mac/.build
          key: mac-rust-swiftpm-${{ hashFiles('mac/Package.swift', 'mac/Package.resolved') }}
      - name: Compile complete Swift adapter against the Rust boundary
        run: swift build --package-path mac --product MeltypeIME -c release -Xswiftc -DMELTYPE_RUST_CORE
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and execute the signed standalone Rust registration helper
        run: |
          set -euo pipefail
          cargo build --release --locked -p meltype-native -p meltype-mac-register
          MELTYPE_NATIVE_LIBRARY="$PWD/target/release/libmeltype_native.dylib" \
            MELTYPE_RUST_REGISTER_HELPER="$PWD/target/release/meltype-register-input-source" \
            MELTYPE_RUST_SELECT_HELPER="$PWD/target/release/meltype-select-input-source" \
            MELTYPE_RUST_CORE=1 MELTYPE_VERSION=0.1.0 bash mac/build.sh --no-install
          codesign --verify --deep --strict mac/build/Meltype.app
          mkdir -p dist/macos-package
          MELTYPE_RUST_DATA_DIR="$RUNNER_TEMP/meltype-package-data" mac/build/Meltype.app/Contents/MacOS/Meltype --self-test | tee dist/macos-package/product-self-test.txt
          bash mac/test/register-helper/run.sh "$PWD/mac/build/Meltype.app/Contents/MacOS/MeltypeRegisterInputSource" | tee dist/macos-package/register-helper.txt
          otool -L mac/build/Meltype.app/Contents/MacOS/MeltypeRegisterInputSource > dist/macos-package/helper-libraries.txt
          test -x mac/build/Meltype.app/Contents/MacOS/MeltypeSelectInputSource
          otool -L mac/build/Meltype.app/Contents/MacOS/MeltypeSelectInputSource > dist/macos-package/selector-libraries.txt
          if grep -i libswift dist/macos-package/selector-libraries.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-rust-package-evidence
          path: dist/macos-package
          if-no-files-found: ignore
  ios:
    if: ${{ !inputs.packages_only }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flash-ios
      - run: brew install xcodegen
      - run: cargo test -p meltype-ios --locked
      - run: cargo clippy -p meltype-ios --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s tools -p test_flash_distributions.py -v
      - run: bash ios/build.sh
      - name: Exercise keyboard controller on iOS Simulator
        id: keyboard_tests
        timeout-minutes: 15
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          # Run every unit and UI test, in separate simulator sessions.
          xcodebuild -project ios/MeltypeFlash.xcodeproj -scheme MeltypeFlash -destination "platform=iOS Simulator,id=$DEVICE" -only-testing:KeyboardTests -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 -derivedDataPath ios/build/tests CODE_SIGNING_ALLOWED=NO test
          xcrun simctl shutdown "$DEVICE" || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/MeltypeFlash.xcodeproj -scheme MeltypeFlash -destination "platform=iOS Simulator,id=$DEVICE" -only-testing:AppUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 -derivedDataPath ios/build/tests CODE_SIGNING_ALLOWED=NO test
      - name: Capture iPhone UI previews
        if: always() && steps.keyboard_tests.outcome != 'skipped'
        timeout-minutes: 3
        run: |
          mkdir -p output/ios-ui
          for RESULT in ios/build/tests/Logs/Test/*.xcresult; do
            [ -d "$RESULT" ] || continue
            xcrun xcresulttool export attachments --path "$RESULT" --output-path "output/ios-ui/$(basename "$RESULT" .xcresult)"
          done
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl install "$DEVICE" ios/build/iphonesimulator/Build/Products/Release-iphonesimulator/MeltypeFlash.app
          xcrun simctl terminate "$DEVICE" com.appipinopi.meltypeflash || true
          xcrun simctl launch "$DEVICE" com.appipinopi.meltypeflash
          sleep 3
          xcrun simctl io "$DEVICE" screenshot output/ios-ui/home-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-previews
          path: output/ios-ui
          retention-days: 3
          if-no-files-found: warn
      - name: Export source for locally signed device builds
        run: |
          git archive --format=zip --output=dist/Meltype-flash-iOS-source.zip HEAD
          cp ios/README.md dist/README-iOS.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            dist/Meltype-flash-iOS-Simulator-arm64.zip
            dist/Meltype-flash-iOS-unsigned.ipa
            dist/Meltype-flash-iOS-source.zip
            dist/README-iOS.md
          if-no-files-found: error
