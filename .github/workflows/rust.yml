name: Rust preview
on:
  workflow_dispatch:
    inputs:
      benchmark_baseline:
        description: '比較する公開タグまたはコミット（auto: Cargoの版より前の最新タグ）'
        type: string
        default: auto
  pull_request:
    paths:
      - 'rust/**'
      - 'android/**'
      - 'Cargo.*'
      - 'dictionaries/**'
      - 'native/tip/**'
      - 'linux/**'
      - 'src/**'
      - 'assets/branding/**'
      - 'tools/parity/**'
      - 'tools/ci/**'
      - 'tools/*rust*'
      - 'tools/benchmark-windows.py'
      - 'tools/plot-windows-benchmark.py'
      - 'tools/test_plot_windows_benchmark.py'
      - 'tools/performance/windows/*.py'
      - 'tools/performance/windows/*.cs'
      - 'tools/performance/windows/*.csproj'
      - 'tools/extract-rust-settings-ui.py'
      - '.github/workflows/rust.yml'
      - '.github/workflows/rust-android.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: rust-preview-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      # PR の更新では古い検査を止め、手動実行は最後まで動かす。
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch previous Rust release
        if: runner.os == 'Windows'
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline || 'auto' }}
        run: |
          if ($env:BENCHMARK_BASELINE -eq 'auto') {
            git fetch --no-tags --depth=1 origin 'refs/tags/flash-*:refs/tags/flash-*' 'refs/tags/rust-*:refs/tags/rust-*'
          } elseif ($env:BENCHMARK_BASELINE -match '^[0-9a-fA-F]{40}$') {
            git fetch --no-tags --depth=1 origin $env:BENCHMARK_BASELINE
          } else {
            $tagRef = "refs/tags/$env:BENCHMARK_BASELINE"
            git check-ref-format $tagRef
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git fetch --no-tags --depth=1 origin "${tagRef}:${tagRef}"
          }
      - name: Install benchmark plotting dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check matplotlib==3.10.8 numpy==2.4.2
      - name: Test automatic comparison and charts
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tools -p 'test_*benchmark*.py' -v
      - name: Linux IBus development and isolated-test runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev ibus gir1.2-ibus-1.0 python3-gi dbus-x11 xvfb fonts-noto-cjk libxkbcommon-x11-0
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p meltype-native --all-targets --features tsf-server --locked -- -D warnings
        if: runner.os == 'Windows'
      - run: cargo test --workspace --locked
      - run: cargo run -p meltype-core --example quality -- quality-report.json --check
      - run: cargo build --workspace --release --locked
      # 現在版のRelease依存関係を再利用し、前のRust版とC#版の測定ホストを追加ビルドする。
      - name: Benchmark C#, previous and current Rust releases
        id: benchmark
        if: runner.os == 'Windows'
        timeout-minutes: 35
        env:
          PYTHONUTF8: '1'
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline || 'auto' }}
        run: python tools/compare-rust-benchmarks.py --build --with-csharp --fetch-tags --baseline-ref "$env:BENCHMARK_BASELINE" --output dist/windows-common-benchmark --samples 5 --warmups 1 --rounds 3
      - name: Render benchmark PNGs and summary
        if: runner.os == 'Windows' && steps.benchmark.outcome == 'success'
        env:
          PYTHONUTF8: '1'
        run: python tools/plot-windows-benchmark.py dist/windows-common-benchmark/report.json --output dist/windows-common-benchmark/charts --github-summary "$env:GITHUB_STEP_SUMMARY"
      - name: Save benchmark evidence
        id: benchmark-artifact
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-common-benchmark
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/windows-common-benchmark/*.json
            dist/windows-common-benchmark/*.jsonl
            dist/windows-common-benchmark/*.log
            dist/windows-common-benchmark/charts/
      - name: Link benchmark evidence
        if: always() && runner.os == 'Windows' && steps.benchmark-artifact.outputs.artifact-url != ''
        env:
          BENCHMARK_ARTIFACT_URL: ${{ steps.benchmark-artifact.outputs.artifact-url }}
        run: '"[ベンチマークのPNG・CSV・生データ]($env:BENCHMARK_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY'
      - name: Windows converter batch ABI bounds and cleanup
        if: runner.os == 'Windows'
        run: python rust/native/tests/windows_converter_batch_smoke.py target/release/meltype_native.dll
      - name: Rust IBus engine through a private daemon and input context
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- /usr/bin/python3 rust/ibus/tests/integration.py target/release/meltype-ibus
          MELTYPE_IBUS_TEST_INSTALLED=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 rust/ibus/tests/integration.py target/release/meltype-ibus
          /usr/bin/python3 rust/ibus/tests/installation.py target/release/meltype-ibus
      - name: Batch evidence and resume integrity
        run: python -m unittest discover -s tools/parity -p test_batch_compare.py -v
      - name: Windows preview file and PE dependency integrity
        run: python -m unittest discover -s tools -p test_rust_windows_package.py -v
      - name: Software OpenGL for real Windows tray and settings tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/setup-windows-opengl.ps1 -Directories target/release,target/debug
      - name: Windows package lifecycle over isolated files
        if: runner.os == 'Windows'
        run: |
          ./rust/Test-Manage-Windows.ps1
          ./rust/Test-WindowsLifecycle.ps1
          ./rust/Test-UpdateWindows.ps1
          ./rust/Test-StartupCli.ps1 -Binary target/release/meltype-flash.exe
          ./rust/Test-TrayStop.ps1 -Binary target/release/meltype-flash.exe
      - name: Build isolated settings render probe
        run: cargo build -p meltype-settings --features visual-test --locked
      - name: Capture six settings pages on Windows and macOS
        if: runner.os != 'Linux'
        run: python tools/parity/ui/capture_settings.py target/debug/meltype-flash${{ runner.os == 'Windows' && '.exe' || '' }} dist/settings-render
      - name: Verify independent native Flash dialogs
        if: runner.os == 'Windows'
        run: python tools/parity/ui/check_dialog_windows.py target/debug/meltype-flash.exe dist/settings-render/native-dialogs.json
      - name: Capture six settings pages on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/parity/ui/capture_settings.py target/debug/meltype-flash dist/settings-render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-render-${{ runner.os }}
          path: |
            dist/settings-render/*.png
            dist/settings-render/*.json
            dist/settings-render/*.log
          if-no-files-found: ignore
      - name: Native ABI callbacks and live conversion
        run: python rust/native/tests/abi_smoke.py
      - name: Unicode mark misspelling suggestions through native ABI
        run: python rust/native/tests/misspelling_marks_smoke.py
      - name: Shift Space conversion and candidate navigation through native ABI
        run: python rust/native/tests/shift_space_smoke.py
      - name: F9 F10 case cycles through native ABI
        run: python rust/native/tests/case_keys_smoke.py
      - name: Prediction display and phrase learning through native ABI
        run: python rust/native/tests/prediction_keys_smoke.py
      - name: Numeric candidate selection through native ABI
        run: python rust/native/tests/number_keys_smoke.py
      - name: Conversion cancellation and Tab key roles through native ABI
        run: python rust/native/tests/number_keys_smoke.py target/release/${{ runner.os == 'Windows' && 'meltype_native.dll' || runner.os == 'macOS' && 'libmeltype_native.dylib' || 'libmeltype_native.so' }} rust/core/tests/data/upstream-conversion-keys.json
      - name: Misspelling suggestions and repairs through native ABI
        run: python rust/native/tests/number_keys_smoke.py target/release/${{ runner.os == 'Windows' && 'meltype_native.dll' || runner.os == 'macOS' && 'libmeltype_native.dylib' || 'libmeltype_native.so' }} rust/core/tests/data/upstream-misspelling-keys.json
      - name: Custom romaji original key traces through native ABI
        run: python rust/native/tests/custom_romaji_smoke.py
      - name: All-setting pairwise and candidate-provider parity against frozen C# replies
        run: python tools/parity/settings-candidates/replay.py target/release/${{ runner.os == 'Windows' && 'meltype_native.dll' || runner.os == 'macOS' && 'libmeltype_native.dylib' || 'libmeltype_native.so' }}
      - name: Additional resumable setting combinations
        run: python tools/parity/settings-candidates/replay.py target/release/${{ runner.os == 'Windows' && 'meltype_native.dll' || runner.os == 'macOS' && 'libmeltype_native.dylib' || 'libmeltype_native.so' }} --fixture rust/core/tests/data/upstream-settings-exhaustive-batch.json
      - name: Expanded setting regression prefixes from original C#
        run: python tools/parity/settings-candidates/replay.py target/release/${{ runner.os == 'Windows' && 'meltype_native.dll' || runner.os == 'macOS' && 'libmeltype_native.dylib' || 'libmeltype_native.so' }} --fixture rust/core/tests/data/upstream-settings-expanded-regressions.json
      - name: Core levels learning context and custom data through native ABI
        run: python rust/native/tests/core_data_smoke.py
      - name: Scored segmentation original key traces through native ABI
        run: python rust/native/tests/scored_smoke.py
      - name: Long and boundary original key traces through native ABI
        run: python rust/native/tests/scored_smoke.py --golden rust/core/tests/data/upstream-long-keys.json
      - name: Resized clauses and converter candidates match original traces
        run: python rust/native/tests/clause_resize_smoke.py
      - name: Selected-text reconversion matches original controller workflows
        run: python rust/native/tests/reconversion_smoke.py
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Original Windows converter and actual framed worker
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          PYTHONUTF8: '1'
        run: |
          dotnet run --project tools/parity/windows-converter/WindowsConverter.csproj -- tools/parity/windows-converter/cases.json > windows-converter-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/windows_converter_smoke.py target/release/meltype_native.dll windows-converter-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/windows-converter-fixture | Out-Null
          rustc --edition=2021 -O rust/native/tests/fixtures/windows_mozc.rs -o dist/windows-converter-fixture/helper.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/windows_worker_converter_smoke.py target/release/meltype-tip-worker.exe dist/windows-converter-fixture/helper.exe windows-converter-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/prediction_worker_smoke.py target/release/meltype-tip-worker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/parity/mozc-lifecycle/MozcLifecycle.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --filter tools/parity/mozc-lifecycle/filter-cases.json > mozc-learning-filter-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --raw tools/parity/mozc-lifecycle/raw-cases.json > clause-raw-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --language tools/parity/mozc-lifecycle/language-cases.json > clause-language-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --history tools/parity/mozc-lifecycle/history-cases.json > clause-history-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --choice tools/parity/mozc-lifecycle/choice-cases.json > single-choice-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --engine-keys tools/parity/mozc-lifecycle/engine-key-cases.json > engine-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --case-keys tools/parity/mozc-lifecycle/case-key-cases.json > case-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --number-keys tools/parity/mozc-lifecycle/number-key-cases.json > number-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --public-number-keys tools/parity/mozc-lifecycle/public-number-key-cases.json > public-number-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --conversion-keys tools/parity/mozc-lifecycle/conversion-key-cases.json > conversion-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --prediction-keys tools/parity/mozc-lifecycle/prediction-key-cases.json > prediction-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --direct-typos tools/parity/mozc-lifecycle/direct-typo-cases.json > direct-typos-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/mozc-lifecycle/MozcLifecycle.csproj -- --misspelling-keys tools/parity/mozc-lifecycle/misspelling-key-cases.json > misspelling-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/mozc_learning_reference.py mozc-learning-filter-reference.jsonl clause-raw-reference.jsonl clause-language-reference.jsonl clause-history-reference.jsonl single-choice-reference.jsonl engine-keys-reference.jsonl case-keys-reference.jsonl number-keys-reference.jsonl public-number-keys-reference.jsonl conversion-keys-reference.jsonl prediction-keys-reference.jsonl direct-typos-reference.jsonl misspelling-keys-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p meltype-core --example mozc_lifecycle --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/mozc_lifecycle_smoke.py dist/windows-converter-fixture/helper.exe tools/parity/mozc-lifecycle/bin/Debug/net10.0/MozcLifecycle.dll target/debug/examples/mozc_lifecycle.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Direct-input timeout through native ABI
        run: python rust/native/tests/direct_time_smoke.py
      - name: Original misspelling dictionary results
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project tools/parity/misspellings/Misspellings.csproj -- tools/parity/misspellings/cases.json > misspelling-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/misspelling_reference.py misspelling-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/misspellings/Misspellings.csproj -- --categories > unicode-mark-reference.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project tools/parity/misspellings/Misspellings.csproj -- --shapes tools/parity/misspellings/shape-cases.json > unicode-shape-reference.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/parity/misspellings/generate-marks.py --categories unicode-mark-reference.json --shapes unicode-shape-reference.jsonl --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy input state, replay and prefix learning through native ABI
        run: python rust/native/tests/hook_smoke.py
      - name: Settings UI labels match upstream
        run: |
          git fetch --no-tags --depth=1 origin 6310c44b728d5ad88284853f9ef37ea224993b18
          python tools/extract-rust-settings-ui.py --check
      - name: Package standalone Rust IBus engine
        if: runner.os == 'Linux'
        run: bash rust/build-linux.sh
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rust-IBus-Linux
          path: linux/build/Meltype-flash-linux.tar.gz
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./rust/build-windows.ps1 -WithTip -NativeOnly
      - name: Rust TSF COM objects and native provider delegation
        if: runner.os == 'Windows'
        run: python rust/native/tests/tsf_com_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll native/tip/bin/rust-x64/MeltypeTip.dll
      - name: Rust TSF edit-session scheduling and captured shell actions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python rust/native/tests/tsf_edit_session_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_range_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_composition_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_commit_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_recovery_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_abandoned_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_fields_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_subscriptions_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_edit_events_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_key_state_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_key_entry_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_mode_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_mode_query_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_key_edit_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_commit_request_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_selection_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_apply_reply_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_composition_owner_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_termination_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_recovery_control_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_abandon_control_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_focus_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_shutdown_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_startup_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_open_change_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_core_link_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_service_com_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./rust/native/tests/build-transport-fixture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tsf_service_state_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll dist/tip-transport-fixture/fixture-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/native/tests/tip_transport_smoke.py target/x86_64-pc-windows-msvc/release/meltype_native.dll target/x86_64-pc-windows-msvc/release/meltype-tip-worker.exe dist/tip-transport-fixture/fixture-x64.exe
