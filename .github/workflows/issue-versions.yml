name: Issueの版番号をリリースと同期
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue-release-versions
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update published release choices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/sync-issue-versions.py
          git add .github/ISSUE_TEMPLATE/1-bug.yml .github/ISSUE_TEMPLATE/2-misdetection.yml
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'docs: 公開リリースをIssueの版番号へ同期'
            git push origin HEAD:rust
          fi
