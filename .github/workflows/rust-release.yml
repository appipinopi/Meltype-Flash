# 一時的な容量不足への対応。取り込み済みソースだけを検査し、公開は行わない。
name: Apple Silicon 1.0.0配布検証（ソース固定）
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-v1-apple26-recovery
  cancel-in-progress: false
jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c48fd8dcbaed3b63f13d8e02df2d6b9c96dbe5ed
      - name: Verify merged source and ARM architecture
        run: |
          git rev-parse HEAD
          uname -m
          test "$(git rev-parse HEAD)" = c48fd8dcbaed3b63f13d8e02df2d6b9c96dbe5ed
          test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release-macos-arm64
      - uses: actions/cache@v5
        with:
          path: mac/.build
          key: release-swift-arm64-${{ hashFiles('mac/Package.swift', 'mac/Package.resolved') }}
      - run: cargo test --workspace --locked
      - run: bash rust/build-desktop.sh
      - name: Inspect macOS package
        run: |
          codesign --verify --deep --strict mac/build/Meltype.app
          MELTYPE_RUST_DATA_DIR="$RUNNER_TEMP/meltype-release-test" mac/build/Meltype.app/Contents/MacOS/Meltype --self-test
          bash mac/test/register-helper/run.sh "$PWD/mac/build/Meltype.app/Contents/MacOS/MeltypeRegisterInputSource"
          python3 rust/native/tests/macos_product_smoke.py target/release/libmeltype_native.dylib
          bash mac/package.sh Meltype-flash-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/Meltype-flash-macOS-*.zip
          if-no-files-found: error
